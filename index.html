<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkJu Style | เทมเพลตสำหรับสมาชิก</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a; --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8; --neon-pink: #f472b6; --neon-purple: #c084fc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mitr', sans-serif; }
        body { background: var(--bg-gradient); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; flex: 1; width: 100%; }
        
        /* Hero */
        .hero { text-align: center; padding: 3rem 1rem; background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 30px; margin-bottom: 3rem; box-shadow: 0 0 30px rgba(192, 132, 252, 0.15); }
        .hero-icon { margin-bottom: 1rem; color: var(--neon-pink); }
        .hero h1 { font-size: 2.2rem; background: linear-gradient(to right, var(--neon-pink), var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #cbd5e1; margin-top: 1rem; font-size: 1.1rem; }
        .badge { display: inline-flex; align-items: center; gap: 8px; padding: 0.5rem 1.2rem; background: rgba(244, 114, 182, 0.1); border: 1px solid var(--neon-pink); border-radius: 9999px; color: var(--neon-pink); font-size: 0.9rem; margin-bottom: 1.5rem; }

        /* Grid */
        .ep-section { margin-bottom: 4rem; }
        .ep-title { display: flex; align-items: center; gap: 10px; font-size: 1.8rem; margin-bottom: 1.5rem; padding-left: 1rem; border-left: 4px solid var(--neon-pink); text-shadow: 0 0 10px rgba(244, 114, 182, 0.5); }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 1rem; transition: all 0.3s; display: flex; flex-direction: column; height: 100%; }
        .card:hover { transform: translateY(-10px); border-color: var(--neon-purple); box-shadow: 0 15px 30px rgba(192, 132, 252, 0.2); }
        .card-img { width: 100%; height: 200px; object-fit: cover; border-radius: 16px; margin-bottom: 1rem; }
        .card-title { font-size: 1.2rem; margin-bottom: 1rem; }
        .btn-glow { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0.8rem; background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple)); color: white; text-decoration: none; border-radius: 9999px; font-weight: 500; transition: all 0.3s; box-shadow: 0 4px 15px rgba(244, 114, 182, 0.4); }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(244, 114, 182, 0.7); transform: scale(1.02); }
        
        .loader { text-align: center; padding: 3rem; color: var(--neon-blue); display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--glass-border); border-top-color: var(--neon-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; color: #cbd5e1; padding: 3rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }

        /* Footer & Secret Admin Link */
        .footer { text-align: center; padding: 2rem; border-top: 1px solid var(--glass-border); margin-top: auto; }
        .admin-link { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; opacity: 0.5; transition: opacity 0.3s; }
        .admin-link:hover { opacity: 1; color: var(--neon-pink); }
    </style>
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="badge">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Exclusive Member Only
            </div>
            <div class="hero-icon">
                <svg viewBox="0 0 24 24" width="64" height="64" stroke="currentColor" stroke-width="1.5" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <h1>เว็บไซต์สำหรับสมาชิกภายในคอร์สสอนทำเว็บสไตล์ PinkJu เท่านั้น</h1>
            <p>รวมเทมเพลตทั้งหมดที่มี กดเข้าไปดูตัวอย่างพร้อมใช้งานได้เลย</p>
        </header>

        <main id="templates-container">
            <div class="loader" id="loader">
                <div class="spinner"></div>
                กำลังเตรียมข้อมูลเทมเพลต...
            </div>
        </main>
    </div>

    <!-- ส่วนปุ่มลิงก์ไปหน้า Admin -->
    <footer class="footer">
        <a href="admin.html" class="admin-link">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            เข้าสู่ระบบแอดมิน (สำหรับผู้ดูแลระบบ)
        </a>
    </footer>

    <script>
        const SUPABASE_URL = 'https://fwcwwmnrxecsxjgxephn.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Y3d3bW5yeGVjc3hqZ3hlcGhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNjg4NjMsImV4cCI6MjA5MDk0NDg2M30.aduDIUVyy92BC6uRFBaUaPH2N9tmQlweEk6zWb07GCY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchTemplates() {
            const container = document.getElementById('templates-container');
            const loader = document.getElementById('loader');

            try {
                const { data, error } = await supabase.from('templates').select('*').order('ep', { ascending: true });
                if (error) throw error;
                
                if (loader) loader.style.display = 'none';

                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--glass-border)" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg><p>ยังไม่มีเทมเพลตในระบบค่ะ</p></div>`;
                    return;
                }

                const groupedData = data.reduce((acc, item) => {
                    const ep = item.ep || 'ทั่วไป';
                    if (!acc[ep]) acc[ep] = [];
                    acc[ep].push(item);
                    return acc;
                }, {});

                container.innerHTML = ''; 

                for (const [ep, items] of Object.entries(groupedData)) {
                    const section = document.createElement('div');
                    section.className = 'ep-section';
                    section.innerHTML = `<h2 class="ep-title"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>${ep}</h2>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'card-grid';

                    items.forEach(item => {
                        grid.innerHTML += `
                            <div class="card">
                                <img src="${item.image}" class="card-img" onerror="this.src='https://via.placeholder.com/400x300/0f172a/fff?text=No+Image'">
                                <h3 class="card-title">${item.title}</h3>
                                <a href="${item.link}" target="_blank" class="btn-glow">
                                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                    เข้าใช้งานเทมเพลต
                                </a>
                            </div>`;
                    });
                    section.appendChild(grid);
                    container.appendChild(section);
                }
            } catch (err) {
                container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" width="48" height="48" stroke="red" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><p>เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</p></div>`;
                console.error(err);
            }
        }

        function setupRealtime() {
            supabase.channel('public:templates').on('postgres_changes', { event: '*', schema: 'public', table: 'templates' }, payload => {
                fetchTemplates(); 
            }).subscribe();
        }

        window.onload = () => {
            fetchTemplates();
            setupRealtime();
        };
    </script>
</body>
</html>
