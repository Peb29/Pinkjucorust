<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | PinkJu Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a; --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8; --neon-pink: #f472b6; --neon-purple: #c084fc; --text-muted: #cbd5e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mitr', sans-serif; }
        body { background: var(--bg-gradient); color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h2 { background: linear-gradient(to right, var(--neon-pink), var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
        svg { display: inline-block; vertical-align: middle; }

        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        input { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; border-radius: 12px; outline: none; }
        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .btn { padding: 0.8rem 2rem; border: none; border-radius: 9999px; color: white; font-weight: 500; cursor: pointer; transition: all 0.3s; background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple)); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(244, 114, 182, 0.6); }

        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1rem; display: none; align-items: center; gap: 10px; font-size: 0.9rem; }
        .alert.error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .card { position: relative; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1rem; transition: all 0.3s; display: flex; flex-direction: column; height: 100%; }
        .add-card { border: 2px dashed var(--neon-pink); background: rgba(244, 114, 182, 0.05); justify-content: center; align-items: center; cursor: pointer; min-height: 280px; gap: 1rem; color: var(--neon-pink); font-weight: 500; }
        .add-card:hover { background: rgba(244, 114, 182, 0.1); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(244, 114, 182, 0.2); }
        .item-card:hover { transform: translateY(-5px); border-color: var(--neon-blue); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2); }
        .item-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem; }
        .item-ep { font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 0.2rem; }
        .item-title { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.5rem; color: #fff; }
        .card-actions { position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 8px; }
        .icon-btn { background: rgba(15, 23, 42, 0.7); border: 1px solid var(--glass-border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: all 0.2s; }
        .icon-btn:hover { background: var(--neon-purple); border-color: var(--neon-purple); transform: scale(1.1); }
        .icon-btn.delete:hover { background: #ef4444; border-color: #ef4444; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-dark); border: 1px solid var(--neon-purple); border-radius: 24px; padding: 2rem; width: 100%; max-width: 500px; transform: scale(0.9); transition: transform 0.3s; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .close-modal { position: absolute; top: 1.5rem; right: 1.5rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer; }
        .close-modal:hover { color: white; }
        .file-upload { border: 2px dashed var(--glass-border); border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer; position: relative; transition: all 0.3s;}
        .file-upload:hover { border-color: var(--neon-pink); background: rgba(244, 114, 182, 0.05); }
        .file-upload input[type="file"] { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        #image-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-top: 1rem; display: none; }

        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15,23,42,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--neon-pink); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; color: var(--neon-pink);" id="loading-text">กำลังประมวลผลระบบ...</p>
    </div>

    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="glass-panel" style="max-width: 400px; margin: 15vh auto;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--neon-pink)" stroke-width="1.5" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <h2 style="justify-content: center; margin-top: 10px;">ระบบจัดการเทมเพลต</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">สำหรับ admin PinkJu เท่านั้น</p>
            </div>
            
            <div id="login-alert" class="alert error">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="login-alert-text" style="line-height: 1.4;">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</span>
            </div>

            <!-- กลับมาใช้ form เหมือนเดิม แต่เดี๋ยวเราจัดการการ Submit ใน JS ให้ไม่เด้ง -->
            <form id="login-form">
                <div class="form-group"><label>อีเมล (Email)</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label>รหัสผ่าน (Password)</label><input type="password" id="login-password" required></div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">เข้าสู่ระบบจัดการ</button>
            </form>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard-screen" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                <div><h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">ระบบจัดการเทมเพลต PinkJu</h1><p style="color: var(--text-muted); font-size: 0.9rem;">เว็บไซต์สำหรับสมาชิกภายในคอร์สสอนทำสไตล์ PinkJu เท่านั้น</p></div>
                <button onclick="logout()" class="btn" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); box-shadow: none;"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>ออกจากระบบ</button>
            </div>
            <div class="grid" id="admin-grid"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="item-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">เพิ่มเทมเพลตใหม่</h2>
            <form id="template-form">
                <input type="hidden" id="edit-id"><input type="hidden" id="old-image-url">
                <div class="form-group"><label>ภาพตัวอย่างเทมเพลต</label><div class="file-upload"><svg viewBox="0 0 24 24" width="32" height="32" stroke="var(--neon-pink)" stroke-width="1.5" fill="none" style="margin-bottom: 0.5rem;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg><p style="font-size: 0.9rem; color: var(--text-muted);">เลือกภาพ หรือ ลากไฟล์มาวางที่นี่</p><input type="file" id="temp-image" accept="image/*"><img id="image-preview" src="" alt="Preview"></div></div>
                <div class="form-group"><label>หมวดหมู่ (ตัวอย่าง: EP.1 Base)</label><input type="text" id="temp-ep" required></div>
                <div class="form-group"><label>ชื่อเทมเพลต</label><input type="text" id="temp-title" required></div>
                <div class="form-group"><label>ลิงก์ Google Docs / Drive</label><input type="url" id="temp-link" required></div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>บันทึกข้อมูลเทมเพลต</button>
            </form>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div id="delete-modal" class="modal-overlay" style="z-index: 200;">
        <div class="modal-content" style="max-width: 400px; text-align: center; padding: 3rem 2rem;">
            <svg viewBox="0 0 24 24" width="64" height="64" stroke="#ef4444" stroke-width="1.5" fill="none" style="margin-bottom: 1rem;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <h2 style="justify-content: center; margin-bottom: 0.5rem; color: white;">ยืนยันการลบ</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">หากลบเทมเพลตนี้แล้ว จะไม่สามารถกู้คืนได้</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button onclick="closeDeleteModal()" class="btn" style="background: transparent; border: 1px solid var(--glass-border); box-shadow: none;">ยกเลิก</button>
                <button id="confirm-delete-btn" class="btn" style="background: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);">ยืนยันการลบ</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fwcwwmnrxecsxjgxephn.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Y3d3bW5yeGVjc3hqZ3hlcGhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNjg4NjMsImV4cCI6MjA5MDk0NDg2M30.aduDIUVyy92BC6uRFBaUaPH2N9tmQlweEk6zWb07GCY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                fetchTemplates(); setupRealtime(); 
            } else {
                document.getElementById('login-screen').style.display = 'block';
                document.getElementById('dashboard-screen').style.display = 'none';
            }
        });

        // จัดการ Login ป้องกันหน้าจอเด้ง (รีเฟรช)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // บรรทัดนี้สำคัญมาก ป้องกันการรีเฟรชหน้าเว็บ
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('login-alert');
            const alertText = document.getElementById('login-alert-text');
            
            showLoading("กำลังตรวจสอบรหัสผ่าน..."); 
            alertBox.style.display = 'none';
            
            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    if(error.message === 'Invalid login credentials') {
                        alertText.innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่ค่ะ";
                    } else if(error.message === 'Email not confirmed') {
                        alertText.innerText = "อีเมลนี้ยังไม่ได้ยืนยันตัวตนค่ะ";
                    } else {
                        alertText.innerText = "เข้าสู่ระบบไม่ได้: " + error.message;
                    }
                    alertBox.style.display = 'flex';
                }
            } catch (err) {
                alertText.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่";
                alertBox.style.display = 'flex';
            } finally {
                hideLoading();
            }
        });

        async function logout() { await supabase.auth.signOut(); }

        let allTemplates = [];
        async function fetchTemplates() {
            const { data, error } = await supabase.from('templates').select('*').order('created_at', { ascending: false });
            if (!error) { allTemplates = data; renderGrid(); }
        }

        function renderGrid() {
            const grid = document.getElementById('admin-grid'); grid.innerHTML = ''; 
            const addCard = document.createElement('div'); addCard.className = 'card add-card'; addCard.onclick = () => openModal(); 
            addCard.innerHTML = `<svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--neon-pink)" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span style="font-size: 1.2rem;">เพิ่มเทมเพลตใหม่</span>`;
            grid.appendChild(addCard);

            allTemplates.forEach(item => {
                const card = document.createElement('div'); card.className = 'card item-card';
                card.innerHTML = `
                    <div class="card-actions">
                        <button class="icon-btn" onclick='openModal(${JSON.stringify(item)})'><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                        <button class="icon-btn delete" onclick="openDeleteModal('${item.id}')"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    </div>
                    <img src="${item.image}" class="item-img" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                    <div class="item-ep">${item.ep}</div><div class="item-title">${item.title}</div>`;
                grid.appendChild(card);
            });
        }

        function setupRealtime() { supabase.channel('public:templates').on('postgres_changes', { event: '*', schema: 'public', table: 'templates' }, payload => { fetchTemplates(); }).subscribe(); }

        const modal = document.getElementById('item-modal'); const fileInput = document.getElementById('temp-image'); const preview = document.getElementById('image-preview');
        fileInput.addEventListener('change', function() { const file = this.files[0]; if (file) { const reader = new FileReader(); reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; }; reader.readAsDataURL(file); } });

        window.openModal = function(item = null) {
            document.getElementById('template-form').reset(); preview.style.display = 'none'; preview.src = '';
            if (item) {
                document.getElementById('modal-title').innerHTML = 'แก้ไขเทมเพลต'; document.getElementById('edit-id').value = item.id;
                document.getElementById('temp-title').value = item.title; document.getElementById('temp-ep').value = item.ep;
                document.getElementById('temp-link').value = item.link; document.getElementById('old-image-url').value = item.image;
                preview.src = item.image; preview.style.display = 'block';
            } else { document.getElementById('modal-title').innerHTML = 'เพิ่มเทมเพลตใหม่'; document.getElementById('edit-id').value = ''; document.getElementById('old-image-url').value = ''; }
            modal.classList.add('active');
        }
        window.closeModal = function() { modal.classList.remove('active'); }

        // ป้องกันหน้าต่างอัปโหลดเทมเพลตเด้งเช่นเดียวกัน
        document.getElementById('template-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const id = document.getElementById('edit-id').value; const title = document.getElementById('temp-title').value;
            const link = document.getElementById('temp-link').value; const ep = document.getElementById('temp-ep').value;
            const file = fileInput.files[0]; const oldImageUrl = document.getElementById('old-image-url').value;
            let imageUrl = oldImageUrl;
            
            if (!id && !file) { alert('กรุณาเลือกภาพตัวอย่างเทมเพลตก่อนบันทึก'); return; }
            showLoading("กำลังประมวลผลข้อมูล...");
            try {
                if (file) {
                    const fileExt = file.name.split('.').pop(); const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                    const { error: uploadError } = await supabase.storage.from('images').upload(fileName, file); 
                    if (uploadError) throw uploadError;
                    const { data: { publicUrl } } = supabase.storage.from('images').getPublicUrl(fileName); imageUrl = publicUrl;
                }
                const payload = { title, ep, link, image: imageUrl };
                if (id) await supabase.from('templates').update(payload).eq('id', id); else await supabase.from('templates').insert([payload]);
                closeModal(); 
            } catch (err) { console.error(err); alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล'); } finally { hideLoading(); }
        });

        const deleteModal = document.getElementById('delete-modal'); let currentDeleteId = null;
        window.openDeleteModal = function(id) { currentDeleteId = id; deleteModal.classList.add('active'); }
        window.closeDeleteModal = function() { deleteModal.classList.remove('active'); currentDeleteId = null; }
        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (currentDeleteId) { closeDeleteModal(); showLoading("กำลังลบเทมเพลต..."); await supabase.from('templates').delete().eq('id', currentDeleteId); hideLoading(); }
        });

        function showLoading(text) { document.getElementById('loading-text').innerText = text; document.getElementById('loading-overlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }
    </script>
</body>
</html>
